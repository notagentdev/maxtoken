[build-system]
# Pure Python: MLX ships its own Metal kernels, so there is nothing to compile.
# setuptools floor: 77 is the first release that understands the PEP 639 `license`
# SPDX string and `license-files` below.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# MaxToken: an independent fork of FlashML's MaxToken. The distribution and
# branding are maxtoken; the import package stays `maxtoken` so upstream diffs
# remain readable and no import path breaks.
name = "maxtoken"
# Single source of truth: python/maxtoken/version.py (read via the attr directive below).
dynamic = ["version"]
description = "Serve MoE models bigger than your memory on Apple silicon — elastic expert offload, OpenAI- and Anthropic-compatible APIs, built-in web console"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "notagentdev" }]
# No License:: classifier: setuptools>=77 rejects mixing one with the SPDX string above.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Version ranges are floor=last-verified, ceiling=next-major (kept loose enough to
# resolve, tight enough to bar a silent breaking bump). These ranges are the contract;
# there is no lockfile.
dependencies = [
    "fastapi>=0.115,<1",
    "huggingface_hub>=1.5,<2",
    "mlx>=0.30",
    "mlx-lm>=0.31,<1",
    "msgpack>=1.1,<2",
    "numpy>=2.0",
    "openai>=2.0,<3",
    "partial-json-parser>=0.2,<1",
    "prompt_toolkit>=3.0,<4",
    "pydantic>=2.9,<3",
    "pyzmq>=27,<28",
    "safetensors>=0.6,<1",
    "tqdm>=4.66,<5",
    "transformers>=5.5,<6",
    "uvicorn>=0.30,<1",
]

[project.urls]
Upstream = "https://github.com/FlashML-org/MaxToken"

[project.scripts]
mt = "maxtoken.cli:main"
maxtoken = "maxtoken.cli:main"

[project.optional-dependencies]
dev = ["pytest>=6.0"]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "python"}

[tool.setuptools.dynamic]
version = {attr = "maxtoken.version.__version__"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"*" = ["server/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: takes tens of seconds (big kernel sweeps, real-checkpoint reads); deselect with -m 'not slow'",
    "needs_weights: needs a real local checkpoint, gated behind an env var (see tests/README.md)",
]
